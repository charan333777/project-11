trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'

steps:
  - checkout: self
    displayName: Check out source

  - task: NodeTool@0
    displayName: Use Node.js $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: npm ci
    displayName: Install locked dependencies

  - script: npm run verify
    displayName: Lint, type-check, audit, and build
